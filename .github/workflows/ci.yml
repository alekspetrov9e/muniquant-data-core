name: Data Core CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Tests and migrations (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            image: postgres:16-alpine
          - database: postgres16
            image: postgres:16-alpine
          - database: postgres17
            image: postgres:17-alpine
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muniquant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d muniquant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database != 'sqlite' && 'postgresql+psycopg://test:test@localhost:5432/muniquant_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-build-isolation -e .
      - name: Tests (steps A2-A7 and the moved evidence, hardening and platform tests)
        run: pytest -q
      - name: Setup, drift check and migration round trip
        env:
          DATABASE_URL: ${{ matrix.database != 'sqlite' && 'postgresql+psycopg://test:test@localhost:5432/muniquant_test' || 'sqlite:///data/migration-check.db' }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Bundled demo database restore
        if: matrix.database == 'sqlite'
        run: |
          python scripts/restore_demo.py
          DATABASE_URL=sqlite:///data/demo.db alembic upgrade head
          DATABASE_URL=sqlite:///data/demo.db alembic check
      - name: Export schema stays byte for byte the same
        run: |
          python scripts/export_v1_schema.py
          git diff --exit-code app/evidence-v1.schema.json

  container:
    name: Container runtime, evidence smoke and recovery (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muniquant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d muniquant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/muniquant_test
    steps:
      - uses: actions/checkout@v4
      - name: Container build
        run: docker build -t muniquant-data-core:test .
      - name: Image holds the runtime only, without tools or Workspace code
        run: |
          docker run --rm muniquant-data-core:test sh -c 'test ! -e tools && ! ls app | grep -E "research|permutable|investigation|asset_map|chatbot" && python -c "import app.main"'
      - name: Migrations, runtime and evidence smoke test
        run: |
          docker run --rm --network host -e DATABASE_URL muniquant-data-core:test alembic upgrade head
          # Seeding is a tool, not part of the image: mount tools/ read-only for this test only.
          docker run --name evidence-smoke --network host -d -e DATABASE_URL -e WRITE_TOKEN=ci-only-fixture-token -v "$PWD/tools:/app/tools:ro" muniquant-data-core:test
          trap 'docker logs evidence-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          docker exec evidence-smoke python -m tools.seed
          docker exec evidence-smoke python -m app.evidence_cli freeze /app/data/ci-evidence.zip
          docker exec evidence-smoke python -m app.evidence_cli replay /app/data/ci-evidence.zip
          curl --fail --silent http://127.0.0.1:8000/api/export > /tmp/ci-package.json
          python3 -c "import json; p=json.load(open('/tmp/ci-package.json')); assert p['package_version']=='1.0.0' and len(p['records'])==6"
      - name: Coordinated database and snapshot recovery is equivalent
        run: |
          docker stop evidence-smoke
          docker cp evidence-smoke:/app/data /tmp/evidence-backup
          docker run --rm --user root -v /tmp/evidence-backup:/backup muniquant-data-core:test chown -R appuser:appuser /backup
          docker exec ${{ job.services.postgres.id }} pg_dump -U test -d muniquant_test -Fc > /tmp/operational-backup.dump
          docker exec ${{ job.services.postgres.id }} createdb -U test muniquant_restore_test
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U test -d muniquant_restore_test < /tmp/operational-backup.dump
          original_hash=$(python3 -c "import json; print(json.load(open('/tmp/ci-package.json'))['build_hash'])")
          docker run --rm --network host -v /tmp/evidence-backup:/app/data:ro -e DATABASE_URL=postgresql+psycopg://test:test@localhost:5432/muniquant_restore_test -e EXPECTED_HASH="$original_hash" muniquant-data-core:test python -c "import os; from sqlalchemy.orm import Session; from app.db import make_engine,DATABASE_URL; from app.contract import export_v1; s=Session(make_engine(DATABASE_URL)); p=export_v1(s,'data/snapshots'); assert p['build_hash']==os.environ['EXPECTED_HASH']; print('Coordinated database/snapshot recovery is equivalent')"
          docker rm -f evidence-smoke

  secrets:
    name: Secret scan (gitleaks, all history and files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: History
        run: docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner -v
      - name: Working tree
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 dir /repo --config /repo/.gitleaks.toml --redact --no-banner -v

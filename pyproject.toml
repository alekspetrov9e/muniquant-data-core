[build-system]
requires = ["setuptools>=77", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "muniquant-data-core"
version = "1.0.0"
description = "MuniQuant Data Core: sourced aluminium plant facts and their evidence"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "jsonschema>=4.23,<5", "pypdf==6.21.4", "openpyxl==3.1.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*", "*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tools live outside the runtime package; tests import them from the project root.
pythonpath = ["."]
